name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check all JS source
        run: |
          set -e
          find . \
            -path ./node_modules -prune -o \
            -path ./dashboard/node_modules -prune -o \
            -path ./dashboard/dist -prune -o \
            \( -name '*.js' -o -name '*.mjs' \) -print | \
            while read -r f; do node --check "$f"; done

      - name: Rug-patterns regression (no external deps)
        run: |
          # Run from a temp dir with only the v3 pattern modules to avoid
          # pulling the dotenv-heavy logger chain through the full agent.
          set -e
          mkdir -p /tmp/rugcheck/tools
          cp tools/rug-patterns.js /tmp/rugcheck/tools/
          cp rug-patterns-seed.json /tmp/rugcheck/
          # Stub logger so rug-patterns.js can import "../logger.js"
          cat > /tmp/rugcheck/logger.js <<'STUB'
          export function log() {}
          STUB
          node -e "
            import('/tmp/rugcheck/tools/rug-patterns.js').then(({ matchPatterns, listPatterns }) => {
              const lp = listPatterns();
              if (lp.seed < 5) { console.error('seed underloaded:', lp); process.exit(1); }
              const m = matchPatterns({ transfer_hook: 'X' });
              if (!m.some(p => p.pattern_id === 'seed_honeypot_transfer_hook')) {
                console.error('Bug #1 regression — single-feature seed not matching:', m);
                process.exit(1);
              }
              console.log('rug-patterns OK:', lp.seed, 'seed patterns,', m.length, 'matched honeypot');
            }).catch(e => { console.error(e); process.exit(1); });
          "
