name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Syntax & import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          set -e
          install_once() {
            npm install --no-audit --no-fund --no-progress --prefer-offline
          }
          # npm 10/11 occasionally aborts mid-install with
          # "Exit handler never called!" — retry once if entry files are missing.
          install_once || install_once
          if [ ! -f node_modules/openai/index.js ]; then
            echo "openai/index.js still missing after retry — final attempt"
            rm -rf node_modules
            install_once
          fi
        timeout-minutes: 6

      - name: Verify deps installed
        run: |
          set -e
          for f in node_modules/openai/index.js \
                   node_modules/@solana/web3.js/package.json \
                   node_modules/dotenv/package.json \
                   node_modules/jsonrepair/package.json; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "deps verified"

      - name: Syntax check all JS source
        run: |
          set -e
          find . \
            -path ./node_modules -prune -o \
            -path ./dashboard/node_modules -prune -o \
            -path ./dashboard/dist -prune -o \
            \( -name '*.js' -o -name '*.mjs' \) -print | \
            while read -r f; do node --check "$f"; done

      - name: Import-graph smoke test
        env:
          DRY_RUN: "true"
          HELIUS_API_KEY: "ci-dummy-key"
          WALLET_PRIVATE_KEY: ""
          RPC_URL: "https://api.mainnet-beta.solana.com"
          LLM_BASE_URL: "http://localhost:8787/v1"
          LLM_MODEL: "ci-stub"
        run: |
          node -e "
            const mods = [
              './agent.js',
              './prompt.js',
              './lessons.js',
              './learning-continuous.js',
              './tools/narratives.js',
              './tools/rug-patterns.js',
              './tools/rug-signals.js',
              './tools/rug-harvester.js',
              './tools/ticker-registry.js',
              './tools/wallet-discovery.js',
              './tools/dexscreener.js',
              './tools/executor.js',
              './tools/definitions.js',
            ];
            (async () => {
              for (const m of mods) { await import(m); console.log('ok', m); }
            })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify rug-patterns seed loads + single-feature match works
        run: |
          node -e "
            import('./tools/rug-patterns.js').then(({ matchPatterns, listPatterns }) => {
              const lp = listPatterns();
              if (lp.seed < 5) { console.error('seed underloaded:', lp); process.exit(1); }
              const m = matchPatterns({ transfer_hook: 'X' });
              if (!m.some(p => p.pattern_id === 'seed_honeypot_transfer_hook')) {
                console.error('single-feature regression:', m); process.exit(1);
              }
              console.log('rug-patterns OK:', lp.seed, 'seed,', m.length, 'matches');
            });
          "
