<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ponyou Setup Wizard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wizard-wrap">
  <div style="text-align:center;margin-bottom:1.5rem">
    <h1 style="font-size:22px">🧙 Ponyou Setup Wizard</h1>
    <p style="color:var(--muted);font-size:13px">Step <span id="stepNum">1</span> of 13</p>
  </div>
  <div class="wizard-progress"><div class="fill" id="wizProgress" style="width:7.7%"></div></div>
  <div id="wizardSteps"></div>
  <div class="wizard-nav">
    <button class="btn" id="btnBack" onclick="wizBack()" disabled>← Back</button>
    <div>
      <button class="btn" onclick="wizSkip()" id="btnSkip">Skip</button>
      <button class="btn primary" id="btnNext" onclick="wizNext()">Next →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

      { key: "sellSimEnabled", label: "Enable Pre-Flight Sell Simulator", type: "checkbox", hint: "Verify token can be sold before buying" },
      { key: "rugAnomalyEnabled", label: "Enable Rug Anomaly Detection", type: "checkbox", hint: "Embedding similarity to detect novel rug patterns" },
      { key: "rugLLMEnabled", label: "Enable LLM Rug Analysis", type: "checkbox", hint: "LLM second opinion for ambiguous tokens" },
      { key: "dayPhaseScreenerEnabled", label: "Enable Day Phase Screener", type: "checkbox", hint: "Weekend swing trade discovery (3-7 day holds)" },
      { key: "solscanEnabled", label: "Enable Solscan.io Integration", type: "checkbox", hint: "Wallet tracking + dev wallet detection" },
      { key: "managementIntervalMin", label: "Management Interval (min)", type: "number", hint: "Default 10" },
      { key: "screeningIntervalMin", label: "Screening Interval (min)", type: "number", hint: "Default 30" },

  },
  {

      { key: "_gmgnKeygen", type: "gmgn-keygen" },
      { key: "gmgnApiKey", label: "GMGN API Key", type: "password", hint: "Tempel API Key yang diberikan gmgn.ai/ai setelah kamu daftarkan public key di atas. Kosongkan untuk SKIP GMGN." },
      { key: "gmgnDiscovery", label: "Wallet Discovery (smart-wallet scoring)", type: "checkbox", hint: "Centang = aktif (butuh API Key di atas)" },

      { key: "gmgnRugSignals", label: "Rug Signals — top-holder + security audit", type: "checkbox", hint: "Mengubah SKORING rug — saat live, aktifkan di balik experiment_id (CLAUDE.md)" },
      { key: "gmgnHolderEnrich", label: "Holder Enrichment", type: "checkbox" },
      { key: "gmgnEnrichCap", label: "Enrich Cap (max wallet_stats calls)", type: "number", hint: "Default 25 — lebih kecil = dashboard/discovery lebih cepat" },

let currentStep = 0;
let formData = {};

async function loadExistingConfig() {
  try {
    const res = await fetch("/wizard/config");
    formData = await res.json();
  } catch {}
  try {
    const res = await fetch("/wizard/wallet-status");
    if (res.ok) {
      const status = await res.json();
      formData._walletKeyStatus = {};
      for (const s of (status.slots || [])) formData._walletKeyStatus[s.env_ref] = s.has_key;
    }
  } catch {}
  if (!Array.isArray(formData.wallets) || formData.wallets.length < 2) {
    formData.wallets = [
      { label: "main",  env_ref: "WALLET_KEY_1", capital_pct: 60 },
      { label: "scout", env_ref: "WALLET_KEY_2", capital_pct: 40 },
    ];
  }
  formData._walletKeys = formData._walletKeys || {};
  renderStep();
}

function getNestedVal(obj, key) {
  return key.split(".").reduce((o, k) => o?.[k], obj);
}

function setNestedVal(obj, key, val) {
  const parts = key.split(".");
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    o[parts[i]] = o[parts[i]] || {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = val;
}

function renderStep() {
  const s = STEPS[currentStep];
  document.getElementById("stepNum").textContent = currentStep + 1;
  document.getElementById("wizProgress").style.width = `${((currentStep + 1) / STEPS.length) * 100}%`;
  document.getElementById("btnBack").disabled = currentStep === 0;
  document.getElementById("btnSkip").style.display = (s.required || s.review) ? "none" : "inline-block";
  document.getElementById("btnNext").textContent = s.review ? "💾 Save & Launch" : "Next →";

  const container = document.getElementById("wizardSteps");
  if (s.review) {
    const safe = JSON.parse(JSON.stringify(formData));
    if (safe.privateKey) safe.privateKey = safe.privateKey.slice(0,4) + "…" + safe.privateKey.slice(-4);
    if (safe._walletKeys && typeof safe._walletKeys === "object") {
      const masked = {};
      for (const [k, v] of Object.entries(safe._walletKeys)) {
        masked[k] = typeof v === "string" && v.length > 8 ? `${v.slice(0,4)}…${v.slice(-4)}` : "(set)";
      }
      safe._walletKeys = masked;
    }
    delete safe._walletKeyStatus;
    container.innerHTML = `<div class="wizard-step"><h2>${s.title}</h2>
      <p style="color:var(--muted);font-size:13px;margin-bottom:1rem">Review your configuration before saving:</p>
      <pre style="background:var(--bg);padding:1rem;border-radius:6px;font-size:12px;overflow:auto;max-height:340px">${JSON.stringify(safe, null, 2)}</pre>
    </div>`;
    return;
  }

  let html = `<div class="wizard-step"><h2>${s.title}</h2>`;
  for (const f of (s.fields || [])) {
    const val = getNestedVal(formData, f.key) ?? "";
    if (f.type === "checkbox") {
      html += `<div class="field-row"><label>
        <input type="checkbox" data-key="${f.key}" ${val ? "checked" : ""}> ${f.label}
      </label>${f.hint ? `<div class="field-hint">${f.hint}</div>` : ""}</div>`;
    } else if (f.type === "select") {
      const opts = (f.options || []).map(o => `<option value="${o}" ${val===o?"selected":""}>${o}</option>`).join("");
      html += `<div class="field-row"><label>${f.label}${f.required?" *":""}</label>
        <select data-key="${f.key}">${opts}</select>
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ""}</div>`;
    } else if (f.type === "wallet-list") {
      const enabled = f.condKey ? !!getNestedVal(formData, f.condKey) : true;
      html += renderWalletList(f, enabled);
    } else if (f.type === "trash-wallet-list") {
      html += renderTrashWalletList(f);
    } else if (f.type === "gmgn-keygen") {
      html += renderGmgnKeygen();
    } else {
      html += `<div class="field-row"><label>${f.label}${f.required?" *":""}</label>
        <input type="${f.type}" data-key="${f.key}" value="${val}" placeholder="${f.hint||""}">
        ${f.hint ? `<div class="field-hint">${f.hint}</div>` : ""}</div>`;
    }
  }
  if (s.extra) html += s.extra;
  html += "</div>";
  container.innerHTML = html;
}

function escHtmlW(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderGmgnKeygen() {
  return `<div class="field-row" style="border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:1rem">
    <label>1. Generate GMGN Keypair (Ed25519)</label>
    <div class="field-hint">Bot membuat keypair, menyimpan PRIVATE key di <code>~/.config/gmgn/.env</code> (0600, untuk signing trade), dan menampilkan PUBLIC key untuk kamu daftarkan. Sudah punya key? Lewati langkah ini.</div>
    <label style="display:block;margin:.5rem 0;font-size:13px"><input type="checkbox" id="gmgnOverwrite"> Timpa key lama (regenerate — <b>memutus</b> API key yang sudah terikat)</label>
    <button type="button" class="btn primary" onclick="generateGmgnKeypair()">🔑 Generate Keypair</button>
    <div id="gmgnKeygenOut" style="margin-top:.75rem"></div>
  </div>`;
}

async function generateGmgnKeypair() {
  const overwrite = document.getElementById("gmgnOverwrite")?.checked === true;
  const out = document.getElementById("gmgnKeygenOut");
  out.innerHTML = "<span style='color:var(--muted);font-size:13px'>Generating…</span>";
  try {
    const res = await fetch("/wizard/gmgn-keygen", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ overwrite }),
    });
    const data = await res.json();
    if (!data.ok) {
      const warn = res.status === 409
        ? `${escHtmlW(data.error)}<br>Centang "Timpa key lama" lalu klik lagi untuk regenerate.`
        : escHtmlW(data.error || "failed");
      out.innerHTML = `<div style="color:var(--negative);font-size:13px">⚠️ ${warn}</div>`;
      return;
    }
    out.innerHTML = `
      <div style="font-size:13px;margin-bottom:.35rem">${data.regenerated ? "♻️ Keypair di-regenerate" : "✅ Keypair dibuat"} — private key aman di <code>~/.config/gmgn/.env</code> (tidak pernah dikirim ke browser).</div>
      <label style="font-size:12px;color:var(--muted)">PUBLIC KEY — copy, daftarkan di <a href="https://gmgn.ai/ai" target="_blank" rel="noopener">gmgn.ai/ai</a> (aktifkan swap), lalu tempel API Key-nya di field bawah:</label>
      <textarea readonly rows="4" style="width:100%;font-family:monospace;font-size:11px;margin-top:.25rem" onclick="this.select()">${escHtmlW(data.publicKey)}</textarea>
      <button type="button" class="btn" onclick='navigator.clipboard.writeText(${JSON.stringify(data.publicKey)}).then(()=>showToast("Public key copied",true))'>Copy public key</button>`;
  } catch (e) {
    out.innerHTML = `<div style="color:var(--negative);font-size:13px">❌ ${escHtmlW(e.message)}</div>`;
  }
}

function renderWalletList(field, enabled) {
  if (!enabled) {
    return `<div class="field-row"><label>${field.label}</label>
      <div class="field-hint" style="padding:.75rem;background:var(--bg);border-radius:6px">
        ☑️ Enable Multi-Wallet di atas untuk mengisi slot wallet (2-10).
      </div></div>`;
  }
  const rows = (formData.wallets || []).slice(0, 10);
  const status = formData._walletKeyStatus || {};
  let html = `<div class="field-row"><label>${field.label}</label>

    <!-- Quick Delete Form -->
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.75rem">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">🗑 Hapus Wallet Slot</div>
      <div class="input-row" style="display:flex;gap:.5rem">
        <input type="text" id="walletDeleteInput" placeholder="Ketik label wallet yang ingin dihapus…" style="flex:1;font-size:12px">
        <button class="btn danger" type="button" onclick="quickDeleteWalletRow()">Hapus</button>
      </div>
      <div id="walletDeleteMsg" style="font-size:11px;margin-top:.35rem;min-height:1rem"></div>
    </div>

    <!-- Search / Filter -->
    <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
      <input type="text" id="walletSearchInput" placeholder="🔍 Cari wallet slot…" oninput="filterWalletRows()" style="flex:1;font-size:12px">
    </div>

    <div id="walletList" style="display:flex;flex-direction:column;gap:.5rem">`;
  rows.forEach((w, i) => { html += renderWalletRow(w, i, status); });
  html += `</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:.5rem">
      <button class="btn" type="button" onclick="addWalletRow()">+ Add Wallet</button>
      <div id="walletTotal" style="font-size:13px;color:var(--muted)"></div>
    </div>
    <div class="field-hint" style="margin-top:.25rem">Private key disimpan di .env sebagai WALLET_KEY_1..10. user-config.json hanya simpan label + env_ref + capital_pct.</div>
  </div>`;
  setTimeout(updateWalletTotal, 0);
  return html;
}

function filterWalletRows() {
  const q = (document.getElementById("walletSearchInput")?.value || "").toLowerCase().trim();
  document.querySelectorAll(".wallet-row").forEach(row => {
    const label = (row.querySelector('[data-row-field="label"]')?.value || "").toLowerCase();
    row.style.display = (!q || label.includes(q)) ? "" : "none";
  });
}

function quickDeleteWalletRow() {
  const q = (document.getElementById("walletDeleteInput")?.value || "").trim().toLowerCase();
  const msgEl = document.getElementById("walletDeleteMsg");
  if (!q) { msgEl.textContent = "⚠ Ketik label wallet terlebih dahulu."; msgEl.style.color = "var(--yellow)"; return; }
  const { wallets, keys } = readWalletRows();
  if (wallets.length <= 2) { msgEl.textContent = "Minimal 2 wallet slot."; msgEl.style.color = "var(--red)"; return; }
  const before = wallets.length;
  const filtered = wallets.filter(w => !(w.label || "").toLowerCase().includes(q));
  if (filtered.length === before) { msgEl.textContent = "Label tidak ditemukan."; msgEl.style.color = "var(--red)"; return; }
  if (filtered.length < 2) { msgEl.textContent = "Tidak bisa — minimal 2 slot harus tersisa."; msgEl.style.color = "var(--red)"; return; }
  const reindexed = filtered.map((w, i) => ({ ...w, env_ref: `WALLET_KEY_${i + 1}` }));
  formData.wallets = reindexed;
  formData._walletKeys = { ...(formData._walletKeys || {}), ...keys };
  document.getElementById("walletDeleteInput").value = "";
  renderStep();
  setTimeout(() => {
    const m = document.getElementById("walletDeleteMsg");
    if (m) { m.textContent = `✓ ${before - filtered.length} slot dihapus.`; m.style.color = "var(--green)"; }
  }, 50);
}

function renderWalletRow(w, i, status) {
  const envRef = `WALLET_KEY_${i + 1}`;
  const hasKey = !!status[envRef];
  const ph = hasKey ? "•••• already set (leave blank to keep)" : "bs58 private key";
  const canRemove = (formData.wallets || []).length > 2;
  return `<div class="wallet-row" data-row="${i}" style="display:grid;grid-template-columns:1fr 110px 80px 1fr auto;gap:.4rem;align-items:center;background:var(--bg);padding:.4rem;border-radius:6px">
    <input type="text" data-row-field="label" placeholder="label" value="${(w.label||"").replace(/"/g,"&quot;")}">
    <input type="text" value="${envRef}" readonly style="opacity:.6">
    <input type="number" data-row-field="capital_pct" placeholder="pct" value="${w.capital_pct||""}" min="0" max="100" step="0.01" onchange="updateWalletTotal()">
    <input type="password" data-row-field="key" placeholder="${ph}" data-has-key="${hasKey?'1':'0'}">
    <button class="btn" type="button" onclick="removeWalletRow(${i})" ${canRemove?"":"disabled"}>−</button>
  </div>`;
}

function readWalletRows() {
  const rows = document.querySelectorAll(".wallet-row");
  const wallets = [];
  const keys = {};
  rows.forEach((row, i) => {
    const label = row.querySelector('[data-row-field="label"]').value.trim();
    const pct = parseFloat(row.querySelector('[data-row-field="capital_pct"]').value);
    const keyInput = row.querySelector('[data-row-field="key"]');
    const envRef = `WALLET_KEY_${i + 1}`;
    if (!label) return;
    wallets.push({ label, env_ref: envRef, capital_pct: isFinite(pct) ? pct : 0 });
    const keyVal = keyInput.value.trim();
    if (keyVal) keys[envRef] = keyVal;
  });
  return { wallets, keys };
}

function addWalletRow() {
  const { wallets, keys } = readWalletRows();
  if (wallets.length >= 10) { showToast("Max 10 wallets", false); return; }
  formData.wallets = wallets.concat([{ label: `wallet-${wallets.length + 1}`, env_ref: `WALLET_KEY_${wallets.length + 1}`, capital_pct: 0 }]);
  formData._walletKeys = { ...formData._walletKeys, ...keys };
  renderStep();
}

function removeWalletRow(idx) {
  const { wallets, keys } = readWalletRows();
  if (wallets.length <= 2) { showToast("Min 2 wallets", false); return; }
  wallets.splice(idx, 1);
  // Re-index env_ref so slots stay positional (1..N).
  const reindexed = wallets.map((w, i) => ({ ...w, env_ref: `WALLET_KEY_${i + 1}` }));
  formData.wallets = reindexed;
  // Drop keys beyond new length; keep keys for slots that remain.
  const newKeys = {};
  for (let i = 0; i < reindexed.length; i++) {
    const envRef = `WALLET_KEY_${i + 1}`;
    if (keys[envRef]) newKeys[envRef] = keys[envRef];
  }
  formData._walletKeys = newKeys;
  renderStep();
}

function updateWalletTotal() {
  const total = Array.from(document.querySelectorAll('[data-row-field="capital_pct"]'))
    .map(el => parseFloat(el.value) || 0)
    .reduce((a, b) => a + b, 0);
  const el = document.getElementById("walletTotal");
  if (!el) return;
  const ok = Math.abs(total - 100) < 0.01;
  el.textContent = `Total: ${total.toFixed(2)}% ${ok ? "✓" : "(harus 100%)"}`;
  el.style.color = ok ? "var(--ok, #4ade80)" : "var(--warn, #fbbf24)";
}

// ─── Trash Wallet List ──────────────────────────────────
function renderTrashWalletList(field) {
  const rows = (formData.trashWallets || []);
  let html = `<div class="field-row"><label>${field.label}</label>
    <div class="field-hint" style="margin-bottom:.75rem">${field.hint}</div>

    <!-- Quick Delete Form -->
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.75rem">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem">🗑 Hapus Wallet</div>
      <div class="input-row" style="display:flex;gap:.5rem">
        <input type="text" id="trashDeleteInput" placeholder="Ketik alamat atau label wallet yang ingin dihapus…" style="flex:1;font-family:monospace;font-size:12px">
        <button class="btn danger" type="button" onclick="quickDeleteTrashWallet()">Hapus</button>
      </div>
      <div id="trashDeleteMsg" style="font-size:11px;margin-top:.35rem;min-height:1rem"></div>
    </div>

    <!-- Search / Filter -->
    <div style="display:flex;gap:.5rem;margin-bottom:.5rem">
      <input type="text" id="trashSearchInput" placeholder="🔍 Cari wallet dalam daftar…" oninput="filterTrashWallets()" style="flex:1;font-size:12px">
    </div>

    <div id="trashWalletList" style="display:flex;flex-direction:column;gap:.4rem">`;
  rows.forEach((w, i) => {
    const addr = typeof w === "string" ? w : (w?.address || "");
    const label = (w && w.label) || "";
    html += renderTrashWalletRow(addr, label, i);
  });
  if (rows.length === 0) {
    html += `<div id="trashEmpty" style="color:var(--muted);font-size:13px;padding:.5rem">Belum ada trash wallet.</div>`;
  }
  html += `</div>
    <button class="btn" type="button" onclick="addTrashWalletRow()" style="margin-top:.5rem">+ Tambah Wallet</button>
  </div>`;
  return html;
}

function renderTrashWalletRow(addr, label, i) {
  return `<div class="trash-wallet-row" data-row="${i}" style="display:grid;grid-template-columns:1fr auto;gap:.4rem;align-items:center;background:var(--bg);padding:.4rem;border-radius:6px">
    <div style="display:flex;flex-direction:column;gap:.2rem">
      <input type="text" data-trash-field="address" placeholder="Solana wallet address (base58)" value="${addr.replace(/"/g,"&quot;")}" style="font-family:monospace;font-size:12px">
      <input type="text" data-trash-field="label" placeholder="Label opsional (e.g. known-rug-deployer)" value="${label.replace(/"/g,"&quot;")}" style="font-size:12px">
    </div>
    <button class="btn danger" type="button" onclick="removeTrashWalletRow(${i})" style="align-self:center">− Hapus</button>
  </div>`;
}

function filterTrashWallets() {
  const q = (document.getElementById("trashSearchInput")?.value || "").toLowerCase().trim();
  document.querySelectorAll(".trash-wallet-row").forEach(row => {
    const addr = (row.querySelector('[data-trash-field="address"]')?.value || "").toLowerCase();
    const label = (row.querySelector('[data-trash-field="label"]')?.value || "").toLowerCase();
    row.style.display = (!q || addr.includes(q) || label.includes(q)) ? "" : "none";
  });
}

function quickDeleteTrashWallet() {
  const q = (document.getElementById("trashDeleteInput")?.value || "").trim().toLowerCase();
  const msgEl = document.getElementById("trashDeleteMsg");
  if (!q) { msgEl.textContent = "⚠ Ketik alamat atau label terlebih dahulu."; msgEl.style.color = "var(--yellow)"; return; }
  formData.trashWallets = readTrashWalletRows();
  const before = formData.trashWallets.length;
  formData.trashWallets = formData.trashWallets.filter(w => {
    const addr = (typeof w === "string" ? w : w?.address || "").toLowerCase();
    const lbl = (w?.label || "").toLowerCase();
    return !addr.includes(q) && !lbl.includes(q);
  });
  const removed = before - formData.trashWallets.length;
  if (removed === 0) {
    msgEl.textContent = "Tidak ditemukan — cek alamat/label.";
    msgEl.style.color = "var(--red)";
  } else {
    msgEl.textContent = `✓ ${removed} wallet dihapus.`;
    msgEl.style.color = "var(--green)";
    document.getElementById("trashDeleteInput").value = "";
    renderStep();
  }
}

function readTrashWalletRows() {
  const wallets = [];
  document.querySelectorAll(".trash-wallet-row").forEach((row) => {
    const addr = (row.querySelector('[data-trash-field="address"]')?.value || "").trim();
    const label = (row.querySelector('[data-trash-field="label"]')?.value || "").trim();
    if (addr) wallets.push(label ? { address: addr, label } : { address: addr });
  });
  return wallets;
}

function addTrashWalletRow() {
  formData.trashWallets = readTrashWalletRows();
  formData.trashWallets.push({ address: "", label: "" });
  renderStep();
}

function removeTrashWalletRow(idx) {
  formData.trashWallets = readTrashWalletRows();
  formData.trashWallets.splice(idx, 1);
  renderStep();
}

function collectStep() {
  const s = STEPS[currentStep];
  if (s.review) return;
  document.querySelectorAll("[data-key]").forEach(el => {
    const key = el.dataset.key;
    let val;
    if (el.type === "checkbox") val = el.checked;
    else if (el.type === "number") val = el.value !== "" ? Number(el.value) : undefined;
    else val = el.value;
    if (val !== undefined && val !== "") setNestedVal(formData, key, val);
  });
  if (document.querySelector(".wallet-row")) {
    const { wallets, keys } = readWalletRows();
    formData.wallets = wallets;
    formData._walletKeys = { ...(formData._walletKeys || {}), ...keys };
  }
  if (document.querySelector(".trash-wallet-row")) {
    formData.trashWallets = readTrashWalletRows();
  }
}

function wizNext() {
  const s = STEPS[currentStep];
  collectStep();
  if (s.review) return saveWizard();
  if (s.required) {
    for (const f of (s.fields||[])) {
      if (f.required && !getNestedVal(formData, f.key)) {
        showToast(`${f.label} is required`, false); return;
      }
    }
  }
  if (currentStep < 12) { currentStep++; renderStep(); }
}

function wizBack() {
  collectStep();
  if (currentStep > 0) { currentStep--; renderStep(); }
}

function wizSkip() {
  if (currentStep < 12) { currentStep++; renderStep(); }
}

async function saveWizard() {
  try {
    const res = await fetch("/wizard/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(formData),
    });
    const data = await res.json();
    if (data.ok) { showToast("✅ Config saved!", true); setTimeout(() => location.href = "/", 1500); }
    else showToast(data.error || "Save failed", false);
  } catch (e) { showToast(e.message, false); }
}

async function testTelegram() {
  collectStep();
  const res = await fetch("/wizard/test-telegram");
  const data = await res.json();
  showToast(data.ok ? "✅ Test message sent!" : data.error, data.ok);
}

function showToast(msg, ok = true) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = `toast show ${ok ? "ok" : "error"}`;
  setTimeout(() => t.className = "toast", 3000);
}

loadExistingConfig();
</script>
</body>
</html>
